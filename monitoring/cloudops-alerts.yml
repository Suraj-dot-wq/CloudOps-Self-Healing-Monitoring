groups:
  - name: cloudops-alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on CloudOps server"
          description: "CPU usage has exceeded 80% for 2 minutes."

      - alert: HighMemoryUsage
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on CloudOps server"
          description: "Memory usage has exceeded 80% for 2 minutes."

      - alert: HighDiskUsage
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High root disk usage on CloudOps server"
          description: "Root disk usage has exceeded 80% for 2 minutes."
